<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAKIB ❤️ SHANTA</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            background: linear-gradient(180deg, #180022, #2a003d, #10001c);

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 15px;

        }

        .container {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;

            width: 100%;

        }

        .card {

            width: 45%;

            background: rgba(255, 255, 255, 0.08);

            border-radius: 20px;

            padding: 10px;

            backdrop-filter: blur(10px);

            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);

        }

        .ribbon {

            font-size: 35px;

        }

        .name {

            text-align: center;

            font-size: 22px;

            color: #ffc94d;

            font-weight: bold;

        }

        .birth {

            text-align: center;

            margin-top: 8px;

            margin-bottom: 12px;

            font-size: 12px;

        }

        .grid {

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 8px;

        }

        .box {

            background: rgba(255, 255, 255, 0.08);

            border-radius: 15px;

            padding: 10px;

            text-align: center;

        }

        .number {

            font-size: 26px;

            font-weight: bold;

        }

        .label {

            font-size: 12px;

        }

    </style>

</head>

<body>

    <div class="container">

        <!-- RAKIB -->

        <div class="card">

            <div class="name">💙 RAKIB 💙</div>

            <div class="birth">🎂 28 October 2008</div>

            <div class="grid">

                <div class="box">

                    <div class="number" id="rYear"></div>

                    <div class="label">Years</div>

                </div>

                <div class="box">

                    <div class="number" id="rMonth"></div>

                    <div class="label">Months</div>

                </div>

                <div class="box">

                    <div class="number" id="rDay"></div>

                    <div class="label">Days</div>

                </div>

                <div class="box">

                    <div class="number" id="rHour"></div>

                    <div class="label">Hours</div>

                </div>

                <div class="box">

                    <div class="number" id="rMinute"></div>

                    <div class="label">Minutes</div>

                </div>

                <div class="box">

                    <div class="number" id="rSecond"></div>

                    <div class="label">Seconds</div>

                </div>

                <div class="box">

                    <div class="number" id="rMilli"></div>

                    <div class="label">Milli</div>

                </div>

            </div>

        </div>

        <div class="ribbon">🎀</div>

        <!-- SHANTA -->

        <div class="card">

            <div class="name">💖 SHANTA 💖</div>

            <div class="birth">🎂 2 August 2010</div>

            <div class="grid">

                <div class="box">

                    <div class="number" id="sYear"></div>

                    <div class="label">Years</div>

                </div>

                <div class="box">

                    <div class="number" id="sMonth"></div>

                    <div class="label">Months</div>

                </div>

                <div class="box">

                    <div class="number" id="sDay"></div>

                    <div class="label">Days</div>

                </div>

                <div class="box">

                    <div class="number" id="sHour"></div>

                    <div class="label">Hours</div>

                </div>

                <div class="box">

                    <div class="number" id="sMinute"></div>

                    <div class="label">Minutes</div>

                </div>

                <div class="box">

                    <div class="number" id="sSecond"></div>

                    <div class="label">Seconds</div>

                </div>

                <div class="box">

                    <div class="number" id="sMilli"></div>

                    <div class="label">Milli</div>

                </div>

            </div>

        </div>

    </div>

    <script>

        function updateAge(date, prefix) {

            const now = new Date();

            let years = now.getFullYear() - date.getFullYear();

            let months = now.getMonth() - date.getMonth();

            let days = now.getDate() - date.getDate();

            if (days < 0) {

                months--;

                days += 30;

            }

            if (months < 0) {

                years--;

                months += 12;

            }

            document.getElementById(prefix + "Year").textContent = years;

            document.getElementById(prefix + "Month").textContent = months;

            document.getElementById(prefix + "Day").textContent = days;

            document.getElementById(prefix + "Hour").textContent = now.getHours();

            document.getElementById(prefix + "Minute").textContent = now.getMinutes();

            document.getElementById(prefix + "Second").textContent = now.getSeconds();

            document.getElementById(prefix + "Milli").textContent = now.getMilliseconds();

        }

        const rakib = new Date("2008-10-28");

        const shanta = new Date("2010-08-02");

        setInterval(() => {

            updateAge(rakib, "r");

            updateAge(shanta, "s");

        }, 1);

    </script>

</body>

                    </html>
